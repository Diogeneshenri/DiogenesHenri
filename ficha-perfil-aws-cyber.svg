 <linearGradient id="fire" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff5a0"/><stop offset=".45" stop-color="#ff9900"/><stop offset="1" stop-color="#ff9900" stop-opacity="0"/></linearGradient>
 <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>
