<style>
 .hover{animation:hover 3.1s ease-in-out infinite;transform-origin:160px 180px}
 .wave{animation:wave 1.65s ease-in-out infinite;transform-origin:210px 166px}
 .flame{animation:flame .55s ease-in-out infinite alternate;transform-origin:center top}
 .blink{animation:blink 5s infinite;transform-origin:center}
 .spark{animation:spark 2.6s ease-in-out infinite alternate}
 @keyframes hover{0%,100%{transform:translateY(5px)}50%{transform:translateY(-9px)}}
 @keyframes wave{0%,100%{transform:rotate(-8deg)}30%{transform:rotate(21deg)}60%{transform:rotate(-13deg)}80%{transform:rotate(14deg)}}
 @keyframes flame{from{transform:scaleY(.76);opacity:.75}to{transform:scaleY(1.12);opacity:1}}
 @keyframes blink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.12)}}
 @keyframes spark{from{opacity:.25}to{opacity:1}}
 @media (prefers-reduced-motion:reduce){.hover,.wave,.flame,.blink,.spark{animation:none}}
</style>
