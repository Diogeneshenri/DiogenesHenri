<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-label="Ferramentas de estudo: Linux, Git, GitHub, VS Code, MySQL, AWS CLI, CloudShell e Figma">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071422"/><stop offset="1" stop-color="#173348"/></linearGradient><style>.card{fill:#10283a;stroke:#37566a;stroke-width:2}.name{font:700 23px Arial,sans-serif;fill:#fff}.desc{font:15px Arial,sans-serif;fill:#b2cbd7}.tag{font:700 14px Arial,sans-serif;fill:#ffb24b}.pulse{animation:glow 3s ease-in-out infinite alternate}.dot{animation:glow 2s ease-in-out infinite alternate}@keyframes glow{from{opacity:.35}to{opacity:1}}</style></defs>
