<g transform="translate(517 216)"><rect class="card" width="438" height="70" rx="12"/><rect x="0" y="14" width="5" height="42" rx="2" fill="#ff9900"/><text class="name" x="22" y="30">VS Code</text><text class="desc" x="22" y="54">Edição e desenvolvimento</text><circle class="dot" cx="411" cy="20" r="4" fill="#ff9900"/></g>
