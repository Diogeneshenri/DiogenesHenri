<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="DIOGENES HENRIQUE AWS Cloud - Estudante">
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080F1C"/><stop offset=".65" stop-color="#14283E"/><stop offset="1" stop-color="#233C50"/></linearGradient>
 <linearGradient id="orange"><stop stop-color="#FF9900"/><stop offset="1" stop-color="#FFD27C"/></linearGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#47718C" stroke-opacity=".18"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>
 .dash{stroke-dasharray:7 9;animation:move 10s linear infinite}@keyframes move{to{stroke-dashoffset:-160}}
 .pulse{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{opacity:.5;transform:scale(1.06)}}
 .blink{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
 .orbit{animation:orbit 18s linear infinite;transform-origin:810px 145px}@keyframes orbit{to{transform:rotate(360deg)}}
 .appear{animation:appear 1.2s ease-out both}@keyframes appear{from{opacity:0;transform:translateY(12px)}}
 </style>
</defs>
<rect width="1000" height="300" rx="20" fill="url(#bg)"/><rect width="1000" height="300" rx="20" fill="url(#grid)"/>
<path d="M0 257Q160 218 310 255T620 255T1000 249" stroke="#FF9900" stroke-opacity=".3" stroke-width="2" fill="none"/>
<g class="appear"><rect x="34" y="35" width="590" height="228" rx="13" fill="#081523" stroke="#37586B" stroke-width="2"/><path d="M47 35H611Q624 35 624 48V68H34V48Q34 35 47 35" fill="#1C3446"/><circle cx="56" cy="51" r="5" fill="#FF6962"/><circle cx="74" cy="51" r="5" fill="#F8C75D"/><circle cx="92" cy="51" r="5" fill="#5BD2AC"/><text x="325" y="56" fill="#A5B8C7" font-family="monospace" font-size="12" text-anchor="middle">aws-cloud / estudante de ADS</text>
<text x="59" y="103" fill="#FFAD2F" font-family="monospace" font-size="17">ESTUDANTE DE ADS  |  2º PERÍODO</text>
<text x="59" y="150" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="bold" font-size="38">DIOGENES HENRIQUE</text>
<text x="60" y="183" fill="url(#orange)" font-family="Arial, sans-serif" font-weight="bold" letter-spacing="2" font-size="21">AWS CLOUD | EM FORMAÇÃO</text>
<text x="60" y="210" fill="#A5C8D3" font-family="Arial, sans-serif" font-size="15">EC2  /  S3  /  VPC  /  IAM  /  CLOUDWATCH</text>
<text x="60" y="239" fill="#63DDB7" font-family="monospace" font-size="13">+ CIBERSEGURANÇA EM APRENDIZADO <tspan class="blink">▌</tspan></text></g>
<g><circle cx="810" cy="145" r="105" fill="none" stroke="#FF9900" stroke-width="2" class="dash"/><circle cx="810" cy="145" r="82" fill="#0D2637" stroke="#3F6A7E" stroke-width="2"/><circle cx="810" cy="145" r="64" fill="none" stroke="#FF9900" stroke-opacity=".35" stroke-width="1" class="pulse"/>
<path d="M768 172c-35 0-35-49 0-54 11-41 66-42 81-7 39-3 49 61 6 61Z" fill="#193E51" stroke="#FF9900" stroke-width="4" filter="url(#glow)"/>
<text x="810" y="148" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#FFBB52">AWS</text>
<g class="orbit"><circle cx="810" cy="40" r="7" fill="#FF9900"/></g>
<g font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle"><rect x="677" y="79" width="66" height="29" rx="7" fill="#253F52" stroke="#FF9900"/><text x="710" y="98" fill="#FFF1DA">EC2</text><rect x="880" y="79" width="66" height="29" rx="7" fill="#253F52" stroke="#FF9900"/><text x="913" y="98" fill="#FFF1DA">S3</text><rect x="677" y="204" width="66" height="29" rx="7" fill="#253F52" stroke="#FF9900"/><text x="710" y="223" fill="#FFF1DA">VPC</text><rect x="880" y="204" width="66" height="29" rx="7" fill="#253F52" stroke="#FF9900"/><text x="913" y="223" fill="#FFF1DA">IAM</text></g></g>
<text x="810" y="280" font-family="monospace" font-size="13" fill="#9BC5CE" text-anchor="middle">ESTUDAR  •  PRATICAR  •  EVOLUIR</text>
</svg>
