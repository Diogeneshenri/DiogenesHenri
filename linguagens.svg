<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-label="Linguagens e tecnologias: Java, Python, C, JavaScript, SQL, HTML5 e CSS3">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071322"/><stop offset="1" stop-color="#142d41"/></linearGradient><linearGradient id="accent"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffcc70"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<style>
