<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-label="Serviços AWS que estou estudando">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081523"/><stop offset="1" stop-color="#142e42"/></linearGradient><style><![CDATA[
.card{fill:#102538;stroke:#345066;stroke-width:1.5}.accent{fill:#ff9900}.name{font:700 23px Arial,sans-serif;fill:#fff}.desc{font:15px Arial,sans-serif;fill:#b6cbd8}.head{font:700 32px Arial,sans-serif;fill:#fff}.sub{font:17px Arial,sans-serif;fill:#ffb44b}.dot{fill:#ff9900;animation:pulse 2.5s ease-in-out infinite}.card{animation:float 5s ease-in-out infinite}.card:nth-of-type(2n){animation-delay:-2s}@keyframes pulse{50%{opacity:.25}}@keyframes float{50%{transform:translateY(-3px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
]]></style></defs>
<rect width="1000" height="540" rx="22" fill="url(#bg)"/><rect x="24" y="24" width="952" height="492" rx="17" fill="none" stroke="#36566a"/>
