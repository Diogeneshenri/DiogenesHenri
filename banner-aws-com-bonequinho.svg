<text x="810" y="148" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#FFBB52">AWS</text>
<g class="orbit"><circle cx="810" cy="40" r="7" fill="#FF9900"/></g>
<g font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle"><rect x="677" y="79" width="66" height="29" rx="7" fill="#253F52" stroke="#FF9900"/><text x="710" y="98" fill="#FFF1DA">EC2</text><rect x="880" y="79" width="66" height="29" rx="7" fill="#253F52" stroke="#FF9900"/><text x="913" y="98" fill="#FFF1DA">S3</text><rect x="677" y="204" width="66" height="29" rx="7" fill="#253F52" stroke="#FF9900"/><text x="710" y="223" fill="#FFF1DA">VPC</text><rect x="880" y="204" width="66" height="29" rx="7" fill="#253F52" stroke="#FF9900"/><text x="913" y="223" fill="#FFF1DA">IAM</text></g></g>
<text x="810" y="280" font-family="monospace" font-size="13" fill="#9BC5CE" text-anchor="middle">ESTUDAR  •  PRATICAR  •  EVOLUIR</text>
<svg x="455" y="45" width="175" height="197" viewBox="0 0 320 360" aria-label="Bonequinho AWS Cyber flutuando e acenando">
<title>Bonequinho AWS Cyber — acenando e flutuando</title>
<defs>
 <linearGradient id="avatar-suit" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#254968"/><stop offset="1" stop-color="#0a1b2e"/></linearGradient>
 <linearGradient id="avatar-visor" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#73f4f0"/><stop offset="1" stop-color="#138da8"/></linearGradient>
 <linearGradient id="avatar-fire" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff5a0"/><stop offset=".45" stop-color="#ff9900"/><stop offset="1" stop-color="#ff9900" stop-opacity="0"/></linearGradient>
 <filter id="avatar-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<style>
 .avatar-hover{animation:avatar-hover 3.1s ease-in-out infinite;transform-origin:160px 180px}
 .avatar-wave{animation:avatar-wave 1.65s ease-in-out infinite;transform-origin:210px 166px}
 .avatar-flame{animation:avatar-flame .55s ease-in-out infinite alternate;transform-origin:center top}
 .avatar-blink{animation:avatar-blink 5s infinite;transform-origin:center}
 .avatar-spark{animation:avatar-spark 2.6s ease-in-out infinite alternate}
 @keyframes avatar-hover{0%,100%{transform:translateY(5px)}50%{transform:translateY(-9px)}}
 @keyframes avatar-wave{0%,100%{transform:rotate(-8deg)}30%{transform:rotate(21deg)}60%{transform:rotate(-13deg)}80%{transform:rotate(14deg)}}
 @keyframes avatar-flame{from{transform:scaleY(.76);opacity:.75}to{transform:scaleY(1.12);opacity:1}}
 @keyframes avatar-blink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.12)}}
 @keyframes avatar-spark{from{opacity:.25}to{opacity:1}}
 @media (prefers-reduced-motion:reduce){.avatar-hover,.avatar-wave,.avatar-flame,.avatar-blink,.avatar-spark{animation:none}}
</style>
<!-- background intentionally transparent -->
<ellipse cx="158" cy="325" rx="58" ry="9" fill="#00cbd7" opacity=".13"/>
