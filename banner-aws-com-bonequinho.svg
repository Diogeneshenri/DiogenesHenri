<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="DIOGENES HENRIQUE AWS Cloud - Estudante">
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080F1C"/><stop offset=".65" stop-color="#14283E"/><stop offset="1" stop-color="#233C50"/></linearGradient>
 <linearGradient id="orange"><stop stop-color="#FF9900"/><stop offset="1" stop-color="#FFD27C"/></linearGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#47718C" stroke-opacity=".18"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>
 .dash{stroke-dasharray:7 9;animation:move 10s linear infinite}@keyframes move{to{stroke-dashoffset:-160}}
 .pulse{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{opacity:.5;transform:scale(1.06)}}
 .blink{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
 .orbit{animation:orbit 18s linear infinite;transform-origin:810px 145px}@keyframes orbit{to{transform:rotate(360deg)}}
 .appear{animation:appear 1.2s ease-out both}@keyframes appear{from{opacity:0;transform:translateY(12px)}}
 </style>
</defs>
<rect width="1000" height="300" rx="20" fill="url(#bg)"/><rect width="1000" height="300" rx="20" fill="url(#grid)"/>
