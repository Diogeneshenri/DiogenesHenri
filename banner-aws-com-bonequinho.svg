<text x="59" y="103" fill="#FFAD2F" font-family="monospace" font-size="17">ESTUDANTE DE ADS  |  2º PERÍODO</text>
<text x="59" y="150" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="bold" font-size="38">DIOGENES HENRIQUE</text>
<text x="60" y="183" fill="url(#orange)" font-family="Arial, sans-serif" font-weight="bold" letter-spacing="2" font-size="21">AWS CLOUD | EM FORMAÇÃO</text>
<text x="60" y="210" fill="#A5C8D3" font-family="Arial, sans-serif" font-size="15">EC2  /  S3  /  VPC  /  IAM  /  CLOUDWATCH</text>
<text x="60" y="239" fill="#63DDB7" font-family="monospace" font-size="13">+ CIBERSEGURANÇA EM APRENDIZADO <tspan class="blink">▌</tspan></text></g>
<g><circle cx="810" cy="145" r="105" fill="none" stroke="#FF9900" stroke-width="2" class="dash"/><circle cx="810" cy="145" r="82" fill="#0D2637" stroke="#3F6A7E" stroke-width="2"/><circle cx="810" cy="145" r="64" fill="none" stroke="#FF9900" stroke-opacity=".35" stroke-width="1" class="pulse"/>
