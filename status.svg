<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071421"/><stop offset="1" stop-color="#17344a"/></linearGradient><linearGradient id="gem" x2="1" y2="1"><stop stop-color="#ffe3a3"/><stop offset="0.45" stop-color="#ffad23"/><stop offset="1" stop-color="#c66b00"/></linearGradient><filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>text{font-family:Arial,sans-serif}.title{font-size:31px;font-weight:700;fill:#fff}.sub{font-size:16px;fill:#a9c9d6}.label{font-size:17px;font-weight:700;fill:#fff}.detail{font-size:13px;fill:#a9c9d6}.shine{animation:shine 3.6s ease-in-out infinite alternate;transform-origin:center}.spark{animation:blink 2.5s ease-in-out infinite alternate}.bar{animation:grow 2s ease-out both;transform-box:fill-box;transform-origin:left}@keyframes shine{from{opacity:.6;transform:translateY(3px)}to{opacity:1;transform:translateY(-4px)}}@keyframes blink{from{opacity:.15}to{opacity:1}}@keyframes grow{from{transform:scaleX(.05)}to{transform:scaleX(1)}}</style><rect width="1000" height="340" rx="24" fill="url(#bg)"/><rect x="15" y="15" width="970" height="310" rx="19" fill="none" stroke="#31566d" stroke-width="2"/><path d="M30 82 H970" stroke="#31566d"/><circle cx="42" cy="43" r="6" fill="#ff9900" class="spark"/><circle cx="61" cy="43" r="4" fill="#37d7c3" class="spark"/><text x="88" y="52" class="title">MEU GITHUB • EVOLUÇÃO</text><text x="50" y="112" class="sub">Projetos publicados, prática contínua e próximos passos</text><rect x="70" y="143" width="276" height="122" rx="16" fill="#102a3e" stroke="#345e73"/><text x="92" y="187" fill="#ff9900" font-size="32" font-weight="bold">01</text><text x="92" y="219" fill="#fff" font-size="18">Portfólio AWS</text><text x="92" y="245" fill="#9dbdca" font-size="12">Publicado</text><rect x="380" y="143" width="276" height="122" rx="16" fill="#102a3e" stroke="#345e73"/><text x="402" y="187" fill="#ff9900" font-size="32" font-weight="bold">02</text><text x="402" y="219" fill="#fff" font-size="18">Projeto Farol</text><text x="402" y="245" fill="#9dbdca" font-size="12">Publicado</text><rect x="690" y="143" width="276" height="122" rx="16" fill="#102a3e" stroke="#345e73"/><text x="712" y="187" fill="#ff9900" font-size="32" font-weight="bold">03</text><text x="712" y="219" fill="#fff" font-size="18">Novos projetos</text><text x="712" y="245" fill="#9dbdca" font-size="12">Em construção</text><text x="500" y="309" fill="#9dbdca" font-size="14" text-anchor="middle">Para estatísticas reais de commits, linguagens e contribuições, use os cartões dinâmicos no README.</text></svg>